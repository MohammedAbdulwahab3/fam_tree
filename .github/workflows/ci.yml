# CI for the whole monorepo.
#
# This lives at the repository root because GitHub Actions reads workflows from
# .github/workflows/ there and nowhere else. It used to sit in
# backend/.github/workflows/, which meant that from the moment the two projects
# were merged into this repository, nothing ran at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match the go directive in go.mod. The old workflow pinned 1.20
          # against a module requiring 1.24, so it could not have built even
          # where it did run.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race ./...

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: family_tree
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run the phase suites
        env:
          # The suite creates and drops its own database per phase, so it needs
          # a client rather than the container name it uses locally.
          PG_HOST: 127.0.0.1
          PG_PORT: 5433
        run: ./e2e/run.sh

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_tree

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # test/integration needs a running backend and credentials, and skips
      # without them — so only the unit and widget suites run here.
      - name: Test
        run: flutter test test/
