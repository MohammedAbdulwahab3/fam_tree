name: family_tree
description: An emotionally rich, visually stunning family tree exploration application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Auth is handled by the Go backend (JWT); notifications are local-only.

  
  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  
  # Image Handling
  image_picker: ^1.2.1
  file_picker: ^8.1.4
  image: ^4.1.3
  
  # Animations
  
  # Graph & Layout
  
  # Export & Share
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.2
  http: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Maps & Location
  
  # Onboarding
  
  # Deep Linking
  go_router: ^12.1.3
  timeago: ^3.7.1
  video_player: ^2.10.1
  chewie: ^1.13.0
  printing: ^5.14.2
  
  # Voice Messages
  record: ^6.2.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#10B981"  # Green gradient start color
  # Android draws the adaptive foreground inside a mask that crops roughly a
  # quarter off every edge, so it needs its own padded artwork. Pointing it at
  # the full-bleed icon cropped the tree out of its own launcher icon.
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/icons/
