name: family_tree
description: An emotionally rich, visually stunning family tree exploration application.
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.6 is where Color.withValues arrived, which this codebase uses throughout.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Auth is handled by the Go backend (JWT). Notifications are in-app only:
  # the app polls /api/notifications, and there is no push channel.

  # UI & Styling
  # Manrope and Noto Sans Ethiopic are committed under assets/fonts and
  # declared below, rather than fetched at runtime by google_fonts — see
  # assets/fonts/README.md.
  cached_network_image: ^3.3.0
  
  # Image Handling
  image_picker: ^1.2.1
  file_picker: ^8.1.4
  image: ^4.1.3
  
  # Export & Share
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # Utilities
  # The session token is a 30-day credential, so it lives in the platform
  # keystore rather than in SharedPreferences, which stores plain text.
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  url_launcher: ^6.2.2
  http: ^1.1.0
  shared_preferences: ^2.2.2
  
  go_router: ^12.1.3
  timeago: ^3.7.1
  # Amharic names are grapheme clusters, so an initial is taken with
  # `characters` rather than `[0]`. It arrives transitively through Flutter,
  # but the code imports it directly, so it is declared directly.
  characters: ^1.4.0
  # `printing` pulls `pdf` in transitively and the tree export imports it
  # directly, which meant a `printing` upgrade could silently drop it.
  pdf: ^3.12.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  printing: ^5.14.2
  
  # Voice Messages
  record: ^6.2.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#10B981"  # Green gradient start color
  # Android draws the adaptive foreground inside a mask that crops roughly a
  # quarter off every edge, so it needs its own padded artwork. Pointing it at
  # the full-bleed icon cropped the tree out of its own launcher icon.
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/icons/

  fonts:
    # One face does every job; hierarchy comes from size and weight rather
    # than from switching families.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Manrope cannot draw Ethiopic, so this is registered as its fallback and
    # every style carries it. Noto has no 800, so 700 is the heaviest.
    - family: Noto Sans Ethiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
